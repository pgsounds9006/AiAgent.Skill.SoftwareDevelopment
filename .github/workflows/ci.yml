name: CI

on:
  push:
    branches: [main, dev]
    paths: ['src/skills/**', 'src/.codex-plugin/**', 'scripts/check-plugin.py', 'scripts/package-skill.*', '.github/workflows/ci.yml']
  pull_request:
    paths: ['src/skills/**', 'src/.codex-plugin/**', 'scripts/check-plugin.py', 'scripts/package-skill.*', '.github/workflows/ci.yml']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate frontmatter
        run: |
          SKILL=src/skills/software-development/SKILL.md
          test -f "$SKILL" || { echo "::error::$SKILL missing"; exit 1; }
          for key in name description version; do
            grep -qE "^$key:" "$SKILL" || { echo "::error::frontmatter missing '$key'"; exit 1; }
          done
          VER="$(grep -m1 '^version:' "$SKILL" | sed 's/^version:[[:space:]]*//' | tr -d '[:space:]')"
          echo "$VER" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::version '$VER' is not semver x.y.z"; exit 1; }
          echo "frontmatter OK (version=$VER)"

      - name: Validate structure
        run: |
          DIR=src/skills/software-development
          test "$(find "$DIR" -mindepth 1 -print)" = "$DIR/SKILL.md" \
            || { echo "::error::skill must contain only SKILL.md"; exit 1; }
          echo "single-file structure OK"

      - name: Validate plugin source and version
        run: python scripts/check-plugin.py

      - name: Package smoke test
        run: bash scripts/package-skill.sh
